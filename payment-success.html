<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>支付成功 - 东北亚数字文创博览会</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .success-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #00e5ff;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #00e5ff;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="bg-[#131315] text-[#e5e1e4] font-body min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center">
        <!-- Success Icon -->
        <div class="mb-8 success-pulse">
            <svg class="w-32 h-32 mx-auto" viewBox="0 0 52 52">
                <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark-check" fill="none" d="m14.1 27.2 7.1 7.2 16.7-16.8"/>
            </svg>
        </div>

        <!-- Success Message -->
        <h1 class="text-4xl font-bold mb-4" style="font-family: 'Space Grotesk', sans-serif;">
            支付成功
        </h1>
        <p class="text-[#bac9cc] mb-8">
            感谢您的购买！门票信息已发送至您的账户
        </p>

        <!-- Order Info -->
        <div class="bg-[#201f21] border border-[#00e5ff]/20 rounded-lg p-6 mb-8">
            <div class="text-left space-y-3">
                <div class="flex justify-between">
                    <span class="text-[#bac9cc] text-sm">订单状态</span>
                    <span class="text-[#00e5ff] font-bold">已支付</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-[#bac9cc] text-sm">订单号</span>
                    <span class="text-sm" id="orderNo">--</span>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="space-y-4">
            <a href="dashboard.html" class="block w-full bg-[#00e5ff] text-[#00363d] py-4 font-bold text-center hover:bg-[#00daf3] transition-colors">
                返回首页
            </a>
            <a href="tickets.html" class="block w-full border border-[#00e5ff] text-[#00e5ff] py-4 font-bold text-center hover:bg-[#00e5ff]/10 transition-colors">
                继续购票
            </a>
        </div>

        <!-- Footer -->
        <p class="mt-8 text-[#bac9cc]/50 text-sm">
            如有疑问，请联系客服
        </p>
    </div>

    <script>
        // Get order number from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderNo = urlParams.get('orderNo');
        if (orderNo) {
            document.getElementById('orderNo').textContent = orderNo;
        }
    </script>
</body>
</html>
