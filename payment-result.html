<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>支付结果 - 东北亚数字文创与模玩艺术博览会</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#131315",
                        "surface-container": "#201f21",
                        "on-surface": "#e5e1e4",
                        "on-surface-variant": "#bac9cc",
                        "primary": "#c3f5ff",
                        "primary-container": "#00e5ff",
                        "on-primary-container": "#00363d",
                        "error": "#ffb4ab",
                        "tertiary": "#ffeac0",
                        "tertiary-container": "#fec931",
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .success-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #00e5ff;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #00e5ff;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }
        .fail-icon {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Success State -->
        <div id="successState" class="text-center hidden">
            <div class="mb-8 success-pulse">
                <svg class="w-32 h-32 mx-auto" viewBox="0 0 52 52">
                    <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark-check" fill="none" d="m14.1 27.2 7.1 7.2 16.7-16.8"/>
                </svg>
            </div>

            <h1 class="text-4xl font-bold mb-4 font-headline">
                支付<span class="text-primary-container">成功</span>
            </h1>
            <p class="text-on-surface-variant mb-8">
                感谢您的购买！门票信息已发送至您的账户
            </p>

            <div class="bg-surface-container border border-[#00e5ff]/20 rounded-lg p-6 mb-8 text-left">
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between">
                        <span class="text-on-surface-variant">订单号</span>
                        <span class="font-mono" id="successOrderNo">--</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-on-surface-variant">订单状态</span>
                        <span class="text-primary font-bold">已支付</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-on-surface-variant">支付金额</span>
                        <span class="font-bold" id="successAmount">--</span>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <a href="my-tickets.html" class="block w-full bg-primary-container text-on-primary-container py-4 font-bold text-center hover:bg-[#00daf3] transition-colors">
                    查看电子票
                </a>
                <a href="dashboard.html" class="block w-full border border-[#00e5ff] text-[#00e5ff] py-4 font-bold text-center hover:bg-[#00e5ff]/10 transition-colors">
                    返回首页
                </a>
            </div>
        </div>

        <!-- Failed State -->
        <div id="failedState" class="text-center hidden">
            <div class="mb-8 fail-icon">
                <span class="material-symbols-outlined text-6xl text-error">cancel</span>
            </div>

            <h1 class="text-4xl font-bold mb-4 font-headline">
                支付<span class="text-error">失败</span>
            </h1>
            <p class="text-on-surface-variant mb-8" id="failReason">
                支付过程中出现问题，请重试
            </p>

            <div class="bg-surface-container border border-error/20 rounded-lg p-6 mb-8 text-left">
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between">
                        <span class="text-on-surface-variant">订单号</span>
                        <span class="font-mono" id="failedOrderNo">--</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-on-surface-variant">订单状态</span>
                        <span class="text-error font-bold">支付失败</span>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <a href="tickets.html" class="block w-full bg-primary-container text-on-primary-container py-4 font-bold text-center hover:bg-[#00daf3] transition-colors">
                    重新购买
                </a>
                <a href="my-tickets.html" class="block w-full border border-[#00e5ff] text-[#00e5ff] py-4 font-bold text-center hover:bg-[#00e5ff]/10 transition-colors">
                    查看我的订单
                </a>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="text-center">
            <div class="inline-block animate-spin rounded-full h-20 w-20 border-4 border-primary-container border-t-transparent mb-8"></div>
            <h2 class="text-2xl font-bold mb-4 font-headline">
                正在确认支付结果...
            </h2>
            <p class="text-on-surface-variant">
                请稍候，我们正在确认您的支付状态
            </p>
        </div>

        <!-- Footer -->
        <p class="mt-8 text-on-surface-variant/50 text-sm text-center">
            如有疑问，请联系客服
        </p>
    </div>

    <script>
        const API_CONFIG = {
            baseUrl: 'http://101.200.126.62:3001/api/v1',  // 阿里云ECS后端API地址
        };

        // 获取URL参数
        const urlParams = new URLSearchParams(window.location.search);
        const orderNo = urlParams.get('orderNo');
        const status = urlParams.get('status');
        const reason = urlParams.get('reason');

        async function checkPaymentStatus() {
            if (!orderNo) {
                showFailed('订单号缺失');
                return;
            }

            // 如果URL中已经有状态信息，直接显示
            if (status === 'success') {
                showSuccess();
                return;
            }

            if (status === 'failed') {
                showFailed(reason || '支付失败');
                return;
            }

            // 否则查询订单状态
            try {
                const response = await fetch(`${API_CONFIG.baseUrl}/orders/${orderNo}`);
                const result = await response.json();

                if (result.code === 'SUCCESS') {
                    const order = result.data;

                    if (order.paymentStatus === 'PAID' || order.orderStatus === 'PAID') {
                        showSuccess(order);
                    } else if (order.paymentStatus === 'FAILED' || order.orderStatus === 'CANCELLED') {
                        showFailed('支付失败或已取消');
                    } else {
                        // 仍需等待，轮询检查
                        setTimeout(checkPaymentStatus, 2000);
                    }
                } else {
                    showFailed('查询订单状态失败');
                }
            } catch (error) {
                console.error('查询失败:', error);
                // 网络错误，继续轮询
                setTimeout(checkPaymentStatus, 2000);
            }
        }

        function showSuccess(order) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('failedState').classList.add('hidden');
            document.getElementById('successState').classList.remove('hidden');

            document.getElementById('successOrderNo').textContent = order?.orderNo || orderNo || '--';

            // 金额已经是元，不需要除以100
            if (order?.totalAmount || order?.paidAmount) {
                const amount = order.totalAmount || order.paidAmount;
                document.getElementById('successAmount').textContent = `¥${parseFloat(amount).toFixed(2)}`;
            }
        }

        function showFailed(failReason) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('successState').classList.add('hidden');
            document.getElementById('failedState').classList.remove('hidden');

            document.getElementById('failedOrderNo').textContent = orderNo || '--';
            document.getElementById('failReason').textContent = failReason || '支付过程中出现问题，请重试';
        }

        // 页面加载时开始检查
        window.addEventListener('load', () => {
            // 延迟1秒后开始检查，给支付回调一些时间
            setTimeout(checkPaymentStatus, 1000);
        });
    </script>
</body>
</html>
