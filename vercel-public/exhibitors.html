<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>

    <title>参展商搜索 - 东北亚数字文创与模玩艺术博览会</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-error-container": "#ffdad6",
                        "surface-variant": "#353437",
                        "on-secondary-container": "#e299ff",
                        "error": "#ffb4ab",
                        "tertiary-container": "#fec931",
                        "background": "#131315",
                        "surface-dim": "#131315",
                        "on-tertiary-fixed": "#251a00",
                        "on-primary-fixed": "#001f24",
                        "secondary-fixed-dim": "#ebb2ff",
                        "surface-container": "#201f21",
                        "surface-bright": "#39393b",
                        "primary-fixed": "#9cf0ff",
                        "primary-container": "#00e5ff",
                        "on-tertiary": "#3e2e00",
                        "on-surface": "#e5e1e4",
                        "on-tertiary-fixed-variant": "#594400",
                        "on-tertiary-container": "#6f5500",
                        "on-error": "#690005",
                        "on-secondary": "#520071",
                        "primary": "#c3f5ff",
                        "on-primary": "#00363d",
                        "inverse-on-surface": "#313032",
                        "tertiary-fixed-dim": "#f3bf26",
                        "secondary-fixed": "#f8d8ff",
                        "surface-tint": "#00daf3",
                        "surface-container-low": "#1c1b1d",
                        "outline": "#849396",
                        "surface-container-high": "#2a2a2c",
                        "primary-fixed-dim": "#00daf3",
                        "inverse-surface": "#e5e1e4",
                        "secondary": "#ebb2ff",
                        "on-background": "#e5e1e4",
                        "outline-variant": "#3b494c",
                        "surface-container-lowest": "#0e0e10",
                        "on-secondary-fixed-variant": "#721199",
                        "tertiary-fixed": "#ffdf96",
                        "on-primary-fixed-variant": "#004f58",
                        "surface-container-highest": "#353437",
                        "error-container": "#93000a",
                        "on-primary-container": "#00626e",
                        "on-surface-variant": "#bac9cc",
                        "surface": "#131315",
                        "inverse-primary": "#006875",
                        "tertiary": "#ffeac0",
                        "on-secondary-fixed": "#320047",
                        "secondary-container": "#721199"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0px", "lg": "0px", "xl": "0px", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .beveled-card {
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
        }
        .technical-grid {
            background-image: linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body">
    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 w-full z-50 bg-[#131315]/80 backdrop-blur-xl border-b border-[#00e5ff]/10 flex justify-between items-center px-8 h-20">
        <a href="dashboard.html" class="text-lg font-bold tracking-tighter text-[#c3f5ff] font-headline hover:text-primary transition-colors">
            东北亚数字文创与模玩艺术博览会
        </a>
        <div class="hidden md:flex gap-8 items-center h-full">
            <a class="text-[#bac9cc] hover:text-[#00e5ff] transition-colors font-label text-sm uppercase tracking-widest" href="about.html">展览概况</a>
            <a class="text-[#00e5ff] font-bold border-b-2 border-[#00e5ff] pb-1 font-label text-sm uppercase tracking-widest" href="#">参展作品</a>
            <a class="text-[#bac9cc] hover:text-[#00e5ff] transition-colors font-label text-sm uppercase tracking-widest" href="#">艺术家</a>
            <a class="text-[#bac9cc] hover:text-[#00e5ff] transition-colors font-label text-sm uppercase tracking-widest" href="#">观展指南</a>
        </div>
        <a href="dashboard.html" class="bg-primary-container text-on-primary-container px-6 py-2 font-headline font-bold text-sm tracking-tight hover:bg-[#00daf3] transition-all duration-300 active:scale-95">
            返回主页
        </a>
    </nav>

    <!-- Hero Section -->
    <header class="relative h-[500px] flex items-center justify-center overflow-hidden pt-20 technical-grid">
        <div class="absolute inset-0 z-0">
            <img alt="Exhibitor Gallery" class="w-full h-full object-cover opacity-40 grayscale"
                 src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=1920&q=80">
            <div class="absolute inset-0 bg-gradient-to-b from-background/50 via-background/70 to-background"></div>
        </div>
        <div class="relative z-10 text-center px-4 max-w-4xl">
            <span class="font-label text-primary tracking-[0.4em] uppercase text-xs mb-6 block">EXPO_REF: 2024-EXHIBITORS</span>
            <h1 class="font-headline text-5xl md:text-7xl font-bold tracking-tighter text-on-surface mb-6">
                参展商<span class="text-primary-container">搜索</span>
            </h1>
            <p class="font-body text-lg text-on-surface-variant">
                探索500+顶尖模型厂商、数字工作室及艺术机构
            </p>
        </div>
    </header>

    <main class="relative z-10 px-6 py-16 max-w-7xl mx-auto">
        <!-- Search & Filter Section -->
        <section class="mb-16">
            <div class="flex flex-col md:flex-row gap-4 mb-8">
                <div class="flex-1 relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">search</span>
                    <input type="text" id="searchInput" placeholder="搜索参展商名称、类别..." class="w-full pl-12 pr-4 py-4 bg-surface-container-low border border-outline-variant text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary-container transition-colors">
                </div>
                <div class="flex gap-2">
                    <button class="filter-btn px-6 py-4 bg-surface-container-low border border-outline-variant hover:border-primary transition-all font-label text-xs tracking-widest active" data-filter="all">全部</button>
                    <button class="filter-btn px-6 py-4 bg-surface-container-low border border-outline-variant hover:border-primary transition-all font-label text-xs tracking-widest" data-filter="hall-a">A馆</button>
                    <button class="filter-btn px-6 py-4 bg-surface-container-low border border-outline-variant hover:border-primary transition-all font-label text-xs tracking-widest" data-filter="hall-b">B馆</button>
                    <button class="filter-btn px-6 py-4 bg-surface-container-low border border-outline-variant hover:border-primary transition-all font-label text-xs tracking-widest" data-filter="hall-c">C馆</button>
                    <button class="filter-btn px-6 py-4 bg-surface-container-low border border-outline-variant hover:border-primary transition-all font-label text-xs tracking-widest" data-filter="hall-d">D馆</button>
                </div>
            </div>
            <div class="flex items-center justify-between text-sm text-on-surface-variant">
                <span class="font-label tracking-widest">显示 <span id="resultCount">8</span> 个参展商</span>
                <div class="flex items-center gap-2">
                    <span class="font-label text-xs tracking-widest">排序:</span>
                    <select class="bg-surface-container-low border border-outline-variant px-4 py-2 focus:outline-none focus:border-primary-container">
                        <option>展位编号</option>
                        <option>公司名称</option>
                        <option>展品类别</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Exhibitor Grid -->
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="exhibitorGrid">
            <!-- 参展商列表区域 - 暂无数据 -->
            <div class="col-span-full py-20 text-center">
                <span class="material-symbols-outlined text-6xl text-outline-variant/20 mb-4">search_off</span>
                <p class="text-on-surface-variant">暂无参展商信息</p>
            </div>
        </section>

        <!-- Pagination -->
        <div class="mt-20 flex justify-center items-center gap-4">
            <button class="w-10 h-10 border border-outline-variant/30 flex items-center justify-center hover:border-primary transition-colors">
                <span class="material-symbols-outlined text-sm">chevron_left</span>
            </button>
            <div class="flex gap-2">
                <button class="w-10 h-10 bg-primary text-on-primary font-label text-sm font-bold">01</button>
                <button class="w-10 h-10 border border-outline-variant/30 text-on-surface-variant font-label text-sm hover:border-primary transition-colors">02</button>
                <button class="w-10 h-10 border border-outline-variant/30 text-on-surface-variant font-label text-sm hover:border-primary transition-colors">03</button>
                <span class="w-10 h-10 flex items-center justify-center text-on-surface-variant/40">...</span>
                <button class="w-10 h-10 border border-outline-variant/30 text-on-surface-variant font-label text-sm hover:border-primary transition-colors">12</button>
            </div>
            <button class="w-10 h-10 border border-outline-variant/30 flex items-center justify-center hover:border-primary transition-colors">
                <span class="material-symbols-outlined text-sm">chevron_right</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#0e0e10] w-full py-12 border-t border-[#00e5ff]/5">
        <div class="flex flex-col items-center gap-6 w-full max-w-7xl mx-auto px-8">
            <div class="text-[#c3f5ff] font-black text-xl font-headline tracking-tighter">NEADC_EXPO 2024</div>
            <nav class="flex flex-wrap justify-center gap-8">
                <a class="text-[#bac9cc]/50 hover:text-[#00e5ff] transition-colors font-label text-[10px] uppercase tracking-[0.1em]" href="#">隐私政策</a>
                <a class="text-[#bac9cc]/50 hover:text-[#00e5ff] transition-colors font-label text-[10px] uppercase tracking-[0.1em]" href="#">服务条款</a>
                <a class="text-[#bac9cc]/50 hover:text-[#00e5ff] transition-colors font-label text-[10px] uppercase tracking-[0.1em]" href="#">联系我们</a>
                <a class="text-[#bac9cc]/50 hover:text-[#00e5ff] transition-colors font-label text-[10px] uppercase tracking-[0.1em]" href="#">合作入驻</a>
            </nav>
            <p class="text-[#bac9cc]/30 font-label text-[10px] uppercase tracking-[0.1em] text-center mt-4">
                © 2024 NORTHEAST ASIA DIGITAL CULTURAL INNOVATION EXPO. ALL RIGHTS RESERVED.
            </p>
        </div>
    </footer>

    <script>
        // 搜索和筛选功能
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const exhibitorCards = document.querySelectorAll('.exhibitor-card');
        const resultCount = document.getElementById('resultCount');

        // 搜索功能
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            filterExhibitors(query, getCurrentFilter());
        });

        // 筛选按钮
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('bg-primary', 'text-on-primary', 'border-primary'));
                filterBtns.forEach(b => b.classList.add('bg-surface-container-low', 'border-outline-variant'));

                this.classList.remove('bg-surface-container-low', 'border-outline-variant');
                this.classList.add('bg-primary', 'text-on-primary', 'border-primary');

                const filter = this.getAttribute('data-filter');
                filterExhibitors(searchInput.value.toLowerCase(), filter);
            });
        });

        function getCurrentFilter() {
            const activeBtn = document.querySelector('.filter-btn.bg-primary');
            return activeBtn ? activeBtn.getAttribute('data-filter') : 'all';
        }

        function filterExhibitors(query, filter) {
            let visibleCount = 0;

            exhibitorCards.forEach(card => {
                const name = card.querySelector('h3').textContent.toLowerCase();
                const desc = card.querySelector('p').textContent.toLowerCase();
                const hall = card.getAttribute('data-hall');

                const matchesQuery = name.includes(query) || desc.includes(query);
                const matchesFilter = filter === 'all' || hall === filter;

                if (matchesQuery && matchesFilter) {
                    card.style.display = '';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            resultCount.textContent = visibleCount;
        }
    </script>
</body>
</html>
