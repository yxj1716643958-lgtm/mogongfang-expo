<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>测试注册</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 500px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; }
        button { width: 100%; padding: 15px; background: #00e5ff; border: none; cursor: pointer; font-size: 16px; }
        .code-inputs { display: flex; gap: 5px; }
        .code-inputs input { width: 40px; text-align: center; font-size: 20px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>快速注册测试</h1>
    <input type="tel" id="mobile" placeholder="手机号" value="18730880262">
    <div class="code-inputs">
        <input type="text" maxlength="1" class="code-input">
        <input type="text" maxlength="1" class="code-input">
        <input type="text" maxlength="1" class="code-input">
        <input type="text" maxlength="1" class="code-input">
        <input type="text" maxlength="1" class="code-input">
        <input type="text" maxlength="1" class="code-input">
    </div>
    <div style="margin: 10px 0;">
        <label><input type="radio" name="userType" value="enthusiast" checked> 模型爱好者</label>
        <label><input type="radio" name="userType" value="professional"> 专业观众</label>
    </div>
    <label><input type="checkbox" id="agreement"> 同意协议</label>
    <button onclick="register()">立即注册</button>
    <div id="message"></div>

    <script>
        const API_BASE = 'http://localhost:3002/api/auth';

        // 自动聚焦第一个输入框
        document.querySelector('.code-input').focus();

        // 验证码输入自动跳转
        document.querySelectorAll('.code-input').forEach((input, index, inputs) => {
            input.addEventListener('input', () => {
                if (input.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
        });

        async function register() {
            const message = document.getElementById('message');
            const mobile = document.getElementById('mobile').value;
            const code = Array.from(document.querySelectorAll('.code-input')).map(i => i.value).join('');
            const userType = document.querySelector('input[name="userType"]:checked').value;
            const agreement = document.getElementById('agreement').checked;

            message.innerHTML = '注册中...';

            if (!mobile || !code || code.length !== 6 || !agreement) {
                message.innerHTML = '<span class="error">请填写完整信息</span>';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile, code })
                });

                const result = await response.json();
                console.log('登录结果:', result);

                if (result.success) {
                    message.innerHTML = '<span class="success">注册成功！</span>';
                    localStorage.setItem('user', JSON.stringify(result.data.user));
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                } else {
                    message.innerHTML = '<span class="error">' + result.message + '</span>';
                }
            } catch (error) {
                console.error(error);
                message.innerHTML = '<span class="error">网络错误: ' + error.message + '</span>';
            }
        }
    </script>
</body>
</html>
