<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>用户登录 - 东北亚数字文创博览会</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00e5ff",
                        "surface": "#131315",
                        "surface-variant": "#353437",
                        "on-surface": "#e5e1e4",
                        "on-surface-variant": "#bac9cc",
                        "outline-variant": "#3b494c",
                        "primary-container": "#00e5ff",
                        "on-primary-container": "#00626e",
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .tab-active {
            border-bottom: 2px solid #00e5ff;
            color: #00e5ff;
        }
        .verification-input {
            display: flex;
            gap: 8px;
        }
        .verification-input input {
            width: 45px;
            height: 45px;
            text-align: center;
            font-size: 18px;
            border: 1px solid #3b494c;
            background: #131315;
            color: #e5e1e4;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="text-primary font-headline text-4xl font-black tracking-tighter uppercase mb-2">
                NE_ADCI_MAE
            </div>
            <p class="text-on-surface-variant text-sm">登录您的账户</p>
        </div>

        <!-- Login Card -->
        <div class="bg-surface-variant/30 backdrop-blur-xl border border-outline-variant/30 p-8 rounded-lg">
            <!-- Tabs -->
            <div class="flex mb-6 border-b border-outline-variant/30">
                <button onclick="switchTab('password')" id="passwordTab" class="flex-1 py-3 text-sm font-bold tab-active transition-colors">
                    密码登录
                </button>
                <button onclick="switchTab('sms')" id="smsTab" class="flex-1 py-3 text-sm font-bold text-on-surface-variant transition-colors">
                    验证码登录
                </button>
            </div>

            <!-- Password Login Form -->
            <form id="passwordForm" class="space-y-4">
                <div>
                    <label class="text-xs text-primary-container font-bold block mb-2">手机号</label>
                    <input type="tel" id="loginMobile" required
                           class="w-full bg-surface border border-outline-variant py-3 px-4 rounded focus:border-primary-container focus:outline-none"
                           placeholder="请输入手机号"
                           maxlength="11">
                </div>
                <div>
                    <label class="text-xs text-primary-container font-bold block mb-2">密码</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" required
                               class="w-full bg-surface border border-outline-variant py-3 px-4 pr-12 rounded focus:border-primary-container focus:outline-none"
                               placeholder="请输入密码">
                        <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer"
                              onclick="togglePasswordVisibility('loginPassword', this)">
                            visibility_off
                        </span>
                    </div>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" id="rememberMe" class="rounded">
                        <span class="text-on-surface-variant">记住我</span>
                    </label>
                    <a href="forgot-password.html" class="text-primary hover:underline">忘记密码？</a>
                </div>
                <button type="submit" class="w-full py-3 bg-primary-container text-on-primary-container font-bold rounded hover:brightness-110 transition-all">
                    登录
                </button>
            </form>

            <!-- SMS Login Form -->
            <form id="smsForm" class="space-y-4 hidden">
                <div>
                    <label class="text-xs text-primary-container font-bold block mb-2">手机号</label>
                    <input type="tel" id="smsMobile" required
                           class="w-full bg-surface border border-outline-variant py-3 px-4 rounded focus:border-primary-container focus:outline-none"
                           placeholder="请输入手机号"
                           maxlength="11">
                </div>
                <div>
                    <label class="text-xs text-primary-container font-bold block mb-2">验证码</label>
                    <div class="flex gap-2">
                        <div class="verification-input flex-1" id="smsCodeInputs">
                            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                        </div>
                        <button type="button" onclick="sendSmsCode()" id="sendSmsBtn"
                                class="px-4 py-2 bg-surface border border-outline-variant rounded hover:border-primary-container transition-all text-sm whitespace-nowrap">
                            发送验证码
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full py-3 bg-primary-container text-on-primary-container font-bold rounded hover:brightness-110 transition-all">
                    登录
                </button>
            </form>

            <!-- Register Link -->
            <div class="mt-6 text-center text-sm">
                <span class="text-on-surface-variant">还没有账户？</span>
                <a href="register.html" class="text-primary hover:underline font-bold">立即注册</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost'
            ? 'http://localhost:3002/api/auth'
            : 'http://101.200.126.62:3002/api/auth';  // 阿里云ECS认证服务
        let currentTab = 'password';

        function switchTab(tab) {
            currentTab = tab;
            const passwordTab = document.getElementById('passwordTab');
            const smsTab = document.getElementById('smsTab');
            const passwordForm = document.getElementById('passwordForm');
            const smsForm = document.getElementById('smsForm');

            if (tab === 'password') {
                passwordTab.classList.add('tab-active');
                smsTab.classList.remove('tab-active');
                passwordForm.classList.remove('hidden');
                smsForm.classList.add('hidden');
            } else {
                smsTab.classList.add('tab-active');
                passwordTab.classList.remove('tab-active');
                smsForm.classList.remove('hidden');
                passwordForm.classList.add('hidden');
            }
        }

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        // Password login - 简化版（前端本地验证）
        document.getElementById('passwordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const mobile = document.getElementById('loginMobile').value;
            const password = document.getElementById('loginPassword').value;

            // 简单验证：手机号和密码不为空
            if (!mobile || !password) {
                alert('请输入手机号和密码');
                return;
            }

            // 模拟登录成功
            const userData = {
                mobile: mobile,
                nickname: '用户',
                loginTime: new Date().toISOString()
            };

            localStorage.setItem('user', JSON.stringify(userData));
            localStorage.setItem('isLoggedIn', 'true');

            alert('登录成功！');
            window.location.href = 'dashboard.html';
        });

        // SMS login - 简化版（前端本地验证）
        document.getElementById('smsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const mobile = document.getElementById('smsMobile').value;
            const inputs = document.querySelectorAll('#smsCodeInputs input');
            const code = Array.from(inputs).map(i => i.value).join('');

            if (code.length !== 6) {
                alert('请输入6位验证码');
                return;
            }

            // 简单验证
            if (!mobile) {
                alert('请输入手机号');
                return;
            }

            // 模拟登录成功
            const userData = {
                mobile: mobile,
                nickname: '用户',
                loginTime: new Date().toISOString()
            };

            localStorage.setItem('user', JSON.stringify(userData));
            localStorage.setItem('isLoggedIn', 'true');

            alert('登录成功！');
            window.location.href = 'dashboard.html';
        });

        // Send SMS code - 简化版（前端模拟）
        function sendSmsCode() {
            const mobile = document.getElementById('smsMobile').value;
            if (!/^1[3-9]\d{9}$/.test(mobile)) {
                alert('请输入正确的手机号');
                return;
            }

            const btn = document.getElementById('sendSmsBtn');
            btn.disabled = true;

            // 模拟发送验证码成功
            alert('验证码已发送（测试码：123456）');
            startCountdown();
        }

        function startCountdown() {
            let countdown = 60;
            const btn = document.getElementById('sendSmsBtn');

            const timer = setInterval(() => {
                countdown--;
                btn.textContent = `${countdown}s`;

                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.textContent = '发送验证码';
                    btn.disabled = false;
                }
            }, 1000);
        }

        // Init SMS code inputs
        document.querySelectorAll('#smsCodeInputs input').forEach((input, index, inputs) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
