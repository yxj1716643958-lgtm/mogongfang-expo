<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>重置密码 - 东北亚数字文创博览会</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .verification-input {
            display: flex;
            gap: 8px;
        }
        .verification-input input {
            width: 45px;
            height: 45px;
            text-align: center;
            font-size: 18px;
            border: 1px solid #3b494c;
            background: #131315;
            color: #e5e1e4;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="text-primary font-headline text-4xl font-black tracking-tighter uppercase mb-2">
                NE_ADCI_MAE
            </div>
            <p class="text-on-surface-variant text-sm">重置您的密码</p>
        </div>

        <!-- Reset Password Card -->
        <div class="bg-surface-variant/30 backdrop-blur-xl border border-outline-variant/30 p-8 rounded-lg">
            <form id="resetForm" class="space-y-4">
                <!-- Step 1: Phone & Code -->
                <div id="step1" class="space-y-4">
                    <div>
                        <label class="text-xs text-primary-container font-bold block mb-2">手机号</label>
                        <input type="tel" id="resetMobile" required
                               class="w-full bg-surface border border-outline-variant py-3 px-4 rounded focus:border-primary-container focus:outline-none"
                               placeholder="请输入注册手机号"
                               maxlength="11">
                    </div>
                    <div>
                        <label class="text-xs text-primary-container font-bold block mb-2">验证码</label>
                        <div class="flex gap-2">
                            <div class="verification-input flex-1" id="resetCodeInputs">
                                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                            </div>
                            <button type="button" onclick="sendResetCode()" id="sendResetBtn"
                                    class="px-4 py-2 bg-surface border border-outline-variant rounded hover:border-primary-container transition-all text-sm whitespace-nowrap">
                                发送验证码
                            </button>
                        </div>
                    </div>
                    <button type="button" onclick="goToStep2()" class="w-full py-3 bg-primary-container text-on-primary-container font-bold rounded hover:brightness-110 transition-all">
                        下一步
                    </button>
                </div>

                <!-- Step 2: New Password -->
                <div id="step2" class="space-y-4 hidden">
                    <div>
                        <label class="text-xs text-primary-container font-bold block mb-2">新密码</label>
                        <div class="relative">
                            <input type="password" id="newPassword" required
                                   class="w-full bg-surface border border-outline-variant py-3 px-4 pr-12 rounded focus:border-primary-container focus:outline-none"
                                   placeholder="6-20位，包含字母和数字"
                                   minlength="6" maxlength="20">
                            <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer"
                                  onclick="togglePasswordVisibility('newPassword', this)">
                                visibility_off
                            </span>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-primary-container font-bold block mb-2">确认密码</label>
                        <div class="relative">
                            <input type="password" id="confirmNewPassword" required
                                   class="w-full bg-surface border border-outline-variant py-3 px-4 pr-12 rounded focus:border-primary-container focus:outline-none"
                                   placeholder="请再次输入新密码">
                            <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer"
                                  onclick="togglePasswordVisibility('confirmNewPassword', this)">
                                visibility_off
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 bg-primary-container text-on-primary-container font-bold rounded hover:brightness-110 transition-all">
                        重置密码
                    </button>
                    <button type="button" onclick="goToStep1()" class="w-full py-3 border border-outline-variant rounded hover:border-primary-container transition-all">
                        返回上一步
                    </button>
                </div>
            </form>

            <!-- Back to Login -->
            <div class="mt-6 text-center text-sm">
                <a href="login.html" class="text-primary hover:underline">← 返回登录</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3002/api/auth';
        let resetMobile = '';
        let resetCode = '';

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        function goToStep1() {
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('step2').classList.add('hidden');
        }

        function goToStep2() {
            resetMobile = document.getElementById('resetMobile').value;
            const inputs = document.querySelectorAll('#resetCodeInputs input');
            resetCode = Array.from(inputs).map(i => i.value).join('');

            if (!/^1[3-9]\d{9}$/.test(resetMobile)) {
                alert('请输入正确的手机号');
                return;
            }

            if (resetCode.length !== 6) {
                alert('请输入6位验证码');
                return;
            }

            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        async function sendResetCode() {
            const mobile = document.getElementById('resetMobile').value;
            if (!/^1[3-9]\d{9}$/.test(mobile)) {
                alert('请输入正确的手机号');
                return;
            }

            const btn = document.getElementById('sendResetBtn');
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/send-reset-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile })
                });

                const result = await response.json();

                if (result.success) {
                    alert('验证码已发送');
                    startCountdown();
                } else {
                    alert(result.message || '发送失败');
                    btn.disabled = false;
                }
            } catch (error) {
                alert('网络错误，请重试');
                btn.disabled = false;
            }
        }

        function startCountdown() {
            let countdown = 60;
            const btn = document.getElementById('sendResetBtn');

            const timer = setInterval(() => {
                countdown--;
                btn.textContent = `${countdown}s`;

                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.textContent = '发送验证码';
                    btn.disabled = false;
                }
            }, 1000);
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword.length < 6 || newPassword.length > 20) {
                alert('密码长度应为6-20位');
                return;
            }

            if (!/[a-zA-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
                alert('密码需包含字母和数字');
                return;
            }

            if (newPassword !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mobile: resetMobile,
                        code: resetCode,
                        newPassword: newPassword
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('密码重置成功！请使用新密码登录');
                    window.location.href = 'login.html';
                } else {
                    alert(result.message || '重置失败');
                }
            } catch (error) {
                alert('网络错误，请重试');
            }
        });

        // Init code inputs
        document.querySelectorAll('#resetCodeInputs input').forEach((input, index, inputs) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
