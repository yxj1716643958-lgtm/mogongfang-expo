<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>NE_ADCI_MAE - 系统访问</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-fixed": "#9cf0ff",
                        "tertiary-container": "#fec931",
                        "primary": "#c3f5ff",
                        "error": "#ffb4ab",
                        "on-secondary": "#520071",
                        "primary-container": "#00e5ff",
                        "surface-container-high": "#2a2a2c",
                        "on-error-container": "#ffdad6",
                        "surface": "#131315",
                        "on-tertiary-container": "#6f5500",
                        "background": "#131315",
                        "surface-variant": "#353437",
                        "surface-dim": "#131315",
                        "secondary-fixed": "#f8d8ff",
                        "inverse-surface": "#e5e1e4",
                        "outline-variant": "#3b494c",
                        "on-tertiary-fixed": "#251a00",
                        "primary-fixed-dim": "#00daf3",
                        "on-error": "#690005",
                        "secondary": "#ebb2ff",
                        "on-primary": "#00363d",
                        "on-primary-container": "#00626e",
                        "on-secondary-fixed": "#320047",
                        "inverse-on-surface": "#313032",
                        "on-secondary-container": "#e299ff",
                        "secondary-container": "#721199",
                        "on-background": "#e5e1e4",
                        "on-tertiary-fixed-variant": "#594400",
                        "outline": "#849396",
                        "on-surface": "#e5e1e4",
                        "surface-tint": "#00daf3",
                        "surface-container": "#201f21",
                        "on-tertiary": "#3e2e00",
                        "surface-bright": "#39393b",
                        "secondary-fixed-dim": "#ebb2ff",
                        "tertiary-fixed-dim": "#f3bf26",
                        "error-container": "#93000a",
                        "tertiary": "#ffeac0",
                        "surface-container-low": "#1c1b1d",
                        "surface-container-highest": "#353437",
                        "on-secondary-fixed-variant": "#721199",
                        "tertiary-fixed": "#ffdf96",
                        "on-primary-fixed-variant": "#004f58",
                        "surface-container-lowest": "#0e0e10",
                        "on-primary-fixed": "#001f24",
                        "on-surface-variant": "#bac9cc",
                        "inverse-primary": "#006875"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "0rem", "lg": "0rem", "xl": "0rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .technical-grid {
            background-image:
                linear-gradient(to right, rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .beveled-corner {
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
        }
        .beveled-corner-inverse {
            clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px);
        }
        @keyframes scan {
            from { transform: translateY(0); }
            to { transform: translateY(100vh); }
        }
        .animate-scan {
            animation: scan 8s linear infinite;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen selection:bg-primary-container selection:text-on-primary-container">
    <!-- Technical Schematic Background -->
    <div class="fixed inset-0 z-0">
        <div class="absolute inset-0 bg-surface"></div>
        <img class="absolute inset-0 w-full h-full object-cover opacity-40 mix-blend-screen"
             src="assets/images/bg-mecha.png"
             alt="Technical Background">
        <div class="absolute inset-0 technical-grid"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-background/80"></div>
    </div>

    <!-- Main Content Canvas -->
    <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-12">
        <!-- Header Section -->
        <header class="mb-16 text-center space-y-6">
            <div class="inline-block relative">
                <div class="text-primary font-headline text-5xl md:text-6xl font-black tracking-tighter uppercase mb-2">
                    NE_ADCI_MAE
                </div>
                <div class="flex items-center justify-center gap-4">
                    <span class="h-px w-8 bg-primary/30"></span>
                    <span class="font-headline text-[10px] tracking-[0.4em] text-primary/60 font-bold uppercase">System_Access_Authorized</span>
                    <span class="h-px w-8 bg-primary/30"></span>
                </div>
            </div>
            <h1 class="text-on-surface-variant font-body text-xl md:text-2xl font-light tracking-widest mt-4">
                链接模型艺术的未来 | Link the Future of Model Art
            </h1>
        </header>

        <section class="w-full max-w-4xl space-y-12">
            <!-- Identity Selection: Two Glass Panels -->
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Professional / Exhibitor -->
                <button class="identity-btn group relative p-8 bg-surface-container-high/40 backdrop-blur-xl border-l-2 border-primary-container/20 hover:border-primary-container transition-all duration-500 text-left overflow-hidden beveled-corner"
                        data-type="exhibitor" id="exhibitorBtn">
                    <div class="absolute top-0 right-0 p-2 opacity-10 group-hover:opacity-100 transition-opacity">
                        <span class="material-symbols-outlined text-4xl text-primary-container">precision_manufacturing</span>
                    </div>
                    <div class="relative z-10">
                        <span class="font-label text-[10px] text-primary-container tracking-widest font-bold block mb-2 uppercase">Protocol_Alpha</span>
                        <h2 class="text-2xl font-headline font-bold text-on-surface mb-2">专业观众 / 展商</h2>
                        <p class="text-sm text-on-surface-variant font-light leading-relaxed">获取商业洽谈、展位管理及全球模型供应链核心数据访问权限。</p>
                    </div>
                    <div class="mt-6 flex items-center text-xs font-label text-primary-container/60 group-hover:text-primary-container transition-colors">
                        <span>AUTHENTICATE</span>
                        <span class="material-symbols-outlined ml-2 text-sm">arrow_forward</span>
                    </div>
                </button>

                <!-- Model Enthusiast -->
                <button class="identity-btn group relative p-8 bg-surface-container-high/40 backdrop-blur-xl border-l-2 border-secondary/20 hover:border-secondary transition-all duration-500 text-left overflow-hidden beveled-corner"
                        data-type="enthusiast" id="enthusiastBtn">
                    <div class="absolute top-0 right-0 p-2 opacity-10 group-hover:opacity-100 transition-opacity">
                        <span class="material-symbols-outlined text-4xl text-secondary">token</span>
                    </div>
                    <div class="relative z-10">
                        <span class="font-label text-[10px] text-secondary tracking-widest font-bold block mb-2 uppercase">Protocol_Beta</span>
                        <h2 class="text-2xl font-headline font-bold text-on-surface mb-2">模型爱好者</h2>
                        <p class="text-sm text-on-surface-variant font-light leading-relaxed">探索数字化模型展厅、参与模型工坊并解锁限定数字藏品收藏。</p>
                    </div>
                    <div class="mt-6 flex items-center text-xs font-label text-secondary/60 group-hover:text-secondary transition-colors">
                        <span>INITIALIZE</span>
                        <span class="material-symbols-outlined ml-2 text-sm">arrow_forward</span>
                    </div>
                </button>
            </div>

            <!-- Login Form -->
            <div class="max-w-md mx-auto w-full bg-surface-container-low/60 backdrop-blur-md p-10 border border-white/5 relative">
                <div class="absolute -top-px left-0 w-12 h-px bg-primary-container"></div>
                <div class="absolute -bottom-px right-0 w-12 h-px bg-primary-container"></div>

                <form class="space-y-8" id="loginForm">
                    <!-- Input Fields -->
                    <div class="space-y-6">
                        <div class="group relative">
                            <label class="font-label text-[10px] text-primary-container tracking-widest font-bold uppercase mb-2 block">USER_IDENTIFIER</label>
                            <input class="w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 text-on-surface focus:ring-0 focus:border-primary-container placeholder:text-on-surface-variant/40 transition-all"
                                   placeholder="手机号 / 邮箱" type="text" id="username" required>
                            <div class="absolute bottom-0 left-0 w-0 h-[2px] bg-primary-container group-focus-within:w-full transition-all duration-500"></div>
                        </div>
                        <div class="group relative">
                            <label class="font-label text-[10px] text-primary-container tracking-widest font-bold uppercase mb-2 block">SECURE_CREDENTIAL</label>
                            <input class="w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 text-on-surface focus:ring-0 focus:border-primary-container placeholder:text-on-surface-variant/40 transition-all"
                                   placeholder="请输入访问密钥" type="password" id="password" required>
                            <div class="absolute bottom-0 left-0 w-0 h-[2px] bg-primary-container group-focus-within:w-full transition-all duration-500"></div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="space-y-6">
                        <button class="w-full py-4 bg-primary-container text-on-primary-container font-headline font-bold text-lg tracking-widest hover:brightness-110 active:scale-[0.98] transition-all relative overflow-hidden group" type="submit">
                            <span class="relative z-10">立即开启模型之旅</span>
                            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700"></div>
                        </button>
                        <div class="flex items-center justify-between text-[10px] font-label tracking-widest text-on-surface-variant uppercase">
                            <a class="hover:text-primary transition-colors" href="#">FORGOT_CREDENTIALS</a>
                            <a class="hover:text-primary transition-colors" href="#">REQUEST_ACCESS</a>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="flex items-center gap-4 py-4">
                        <div class="h-px flex-1 bg-outline-variant/30"></div>
                        <span class="font-label text-[9px] text-on-surface-variant/40 tracking-[0.3em]">SECURE_THIRD_PARTY_BRIDGE</span>
                        <div class="h-px flex-1 bg-outline-variant/30"></div>
                    </div>

                    <!-- Social Login -->
                    <div class="flex justify-center gap-8">
                        <button type="button" class="social-btn w-12 h-12 flex items-center justify-center border border-outline-variant/30 hover:border-primary/50 text-outline transition-all duration-300 group" data-provider="wechat">
                            <span class="material-symbols-outlined text-2xl group-hover:text-primary">chat_bubble</span>
                        </button>
                        <button type="button" class="social-btn w-12 h-12 flex items-center justify-center border border-outline-variant/30 hover:border-primary/50 text-outline transition-all duration-300 group" data-provider="email">
                            <span class="material-symbols-outlined text-2xl group-hover:text-primary">mail</span>
                        </button>
                        <button type="button" class="social-btn w-12 h-12 flex items-center justify-center border border-outline-variant/30 hover:border-primary/50 text-outline transition-all duration-300 group" data-provider="qr">
                            <span class="material-symbols-outlined text-2xl group-hover:text-primary">qr_code_2</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Footer Overlay Info -->
        <footer class="mt-20 text-center space-y-4">
            <p class="font-label text-[10px] tracking-[0.2em] text-on-surface-variant/40 uppercase">
                System_Node: NE_EXPO_V2.0 | Status: Operational
            </p>
            <div class="flex justify-center gap-6 text-[10px] font-label text-on-surface-variant/60 uppercase tracking-widest">
                <a class="hover:text-primary" href="#">Legal_Protocol</a>
                <span class="opacity-20">|</span>
                <a class="hover:text-primary" href="#">Data_Privacy</a>
                <span class="opacity-20">|</span>
                <a class="hover:text-primary" href="#">Technical_Specs</a>
            </div>
            <div class="pt-4 opacity-30">
                <span class="font-label text-[10px] tracking-widest">© 2024 NE_DIGITAL_CULTURAL_EXPO. ALL_RIGHTS_RESERVED.</span>
            </div>
        </footer>
    </main>

    <!-- Corner Decorative Elements -->
    <div class="fixed top-0 left-0 w-32 h-32 border-t border-l border-primary/20 pointer-events-none z-20 m-8"></div>
    <div class="fixed bottom-0 right-0 w-32 h-32 border-b border-r border-primary/20 pointer-events-none z-20 m-8"></div>

    <!-- Aesthetic Scanner Line -->
    <div class="fixed top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary-container/20 to-transparent animate-scan pointer-events-none z-20"></div>

    <script src="assets/js/login.js"></script>
</body>
</html>
