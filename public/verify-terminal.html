<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>现场验票 - 东北亚数字文创博览会</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .beveled-card {
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
        }
        .scanner-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
        }
        #reader {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #00e5ff;
            box-shadow: 0 0 10px #00e5ff;
            animation: scan 2s linear infinite;
            display: none;
        }
        .scan-line.active {
            display: block;
        }
        @keyframes scan {
            0%, 100% { top: 0; }
            50% { top: calc(100% - 2px); }
        }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }
        .result-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .result-error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        .result-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen">
    <!-- Header -->
    <nav class="fixed top-0 w-full z-40 bg-surface/80 backdrop-blur-xl border-b border-primary/20 flex justify-between items-center px-6 h-16">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-primary text-2xl">qr_code_scanner</span>
            <span class="font-headline font-bold text-lg tracking-tighter text-primary">现场验票终端</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-sm text-on-surface-variant">
                <span id="currentTime">--:--:--</span>
            </div>
            <div id="operatorInfo" class="hidden px-4 py-2 bg-surface-container rounded-lg">
                <span class="text-xs text-on-surface-variant">操作员</span>
                <span id="operatorName" class="text-sm font-bold ml-2">--</span>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-6 max-w-6xl mx-auto">
        <!-- 统计卡片 -->
        <section class="mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-surface-container-low rounded-xl p-6 border border-primary/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-on-surface-variant text-sm mb-1">今日核销成功</p>
                        <p id="successCount" class="text-4xl font-headline font-bold text-primary">0</p>
                    </div>
                    <span class="material-symbols-outlined text-primary/30 text-5xl">check_circle</span>
                </div>
            </div>
            <div class="bg-surface-container-low rounded-xl p-6 border border-error/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-on-surface-variant text-sm mb-1">今日核销失败</p>
                        <p id="failCount" class="text-4xl font-headline font-bold text-error">0</p>
                    </div>
                    <span class="material-symbols-outlined text-error/30 text-5xl">cancel</span>
                </div>
            </div>
            <div class="bg-surface-container-low rounded-xl p-6 border border-tertiary/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-on-surface-variant text-sm mb-1">待核销票券</p>
                        <p id="pendingCount" class="text-4xl font-headline font-bold text-tertiary">--</p>
                    </div>
                    <span class="material-symbols-outlined text-tertiary/30 text-5xl">confirmation_number</span>
                </div>
            </div>
        </section>

        <!-- 验票操作区 -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- 扫码验票 -->
            <div class="bg-surface-container rounded-xl p-6 beveled-card">
                <h2 class="font-headline text-xl font-bold mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">qr_code_2</span>
                    扫码验票
                </h2>

                <div class="space-y-4">
                    <!-- 扫码区域 -->
                    <div class="scanner-container mx-auto bg-surface border-2 border-primary/30 rounded-lg relative">
                        <div id="reader"></div>
                        <div id="scanLine" class="scan-line"></div>
                        <div id="scannerPlaceholder" class="absolute inset-0 flex items-center justify-center">
                            <div class="text-center p-6">
                                <span class="material-symbols-outlined text-4xl text-primary/50 block mb-2">qr_code_scanner</span>
                                <p class="text-on-surface-variant text-sm">点击下方按钮启动扫码</p>
                            </div>
                        </div>
                    </div>

                    <!-- 扫码按钮 -->
                    <div class="flex gap-3">
                        <button id="startScanBtn" onclick="startScanner()"
                            class="flex-1 bg-primary-container text-on-primary-container py-3 px-6 font-bold rounded-lg hover:brightness-110 transition flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined">camera_alt</span>
                            启动扫码
                        </button>
                        <button id="stopScanBtn" onclick="stopScanner()"
                            class="flex-1 bg-surface border border-outline-variant py-3 px-6 font-bold rounded-lg hover:bg-surface-container transition hidden flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined">stop</span>
                            停止扫码
                        </button>
                    </div>
                </div>
            </div>

            <!-- 手机号补验 -->
            <div class="bg-surface-container rounded-xl p-6 beveled-card">
                <h2 class="font-headline text-xl font-bold mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-secondary">smartphone</span>
                    手机号补验
                </h2>

                <div class="space-y-4">
                    <p class="text-on-surface-variant text-sm">用于二维码无法扫描时的应急方案，需要人工核对姓名。</p>

                    <div>
                        <label class="block text-sm font-bold mb-2">手机号</label>
                        <input type="tel" id="searchMobile"
                            class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 focus:border-primary focus:outline-none"
                            placeholder="请输入11位手机号" pattern="[0-9]{11}">
                    </div>

                    <button onclick="searchByMobile()"
                        class="w-full bg-secondary-container text-on-secondary-container py-3 px-6 font-bold rounded-lg hover:brightness-110 transition flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined">search</span>
                        查询票券
                    </button>

                    <!-- 查询结果 -->
                    <div id="searchResults" class="hidden space-y-3 mt-4"></div>
                </div>
            </div>
        </section>

        <!-- 最近核销记录 -->
        <section class="bg-surface-container rounded-xl p-6">
            <h2 class="font-headline text-xl font-bold mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">history</span>
                最近核销记录
            </h2>
            <div id="recentRecords" class="space-y-2">
                <p class="text-on-surface-variant text-sm text-center py-8">暂无核销记录</p>
            </div>
        </section>
    </main>

    <!-- 票券详情弹窗 -->
    <div id="ticketModal" class="fixed inset-0 z-50 hidden modal-overlay">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="bg-surface-container rounded-xl p-6 w-full max-w-md beveled-card">
                <h3 class="font-headline text-xl font-bold mb-4 text-center">票券详情</h3>

                <div id="ticketInfo" class="space-y-3 mb-6">
                    <!-- 动态填充 -->
                </div>

                <div class="flex gap-3">
                    <button onclick="closeTicketModal()"
                        class="flex-1 border border-outline-variant py-3 rounded-lg hover:bg-surface transition">
                        取消
                    </button>
                    <button id="confirmWriteoffBtn" onclick="confirmWriteoff()"
                        class="flex-1 bg-primary-container text-on-primary-container py-3 rounded-lg hover:brightness-110 transition font-bold">
                        确认核销
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 核销结果弹窗 -->
    <div id="resultModal" class="fixed inset-0 z-50 hidden modal-overlay">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div id="resultContent" class="rounded-xl p-8 w-full max-w-sm text-center text-white">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        // 根据环境自动选择API地址
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3001/api/v1'
            : 'https://mogongfang-expo-api.onrender.com/api/v1';  // 生产环境API地址

        // 操作员信息（实际应从登录获取）
        const OPERATOR_INFO = {
            operatorId: 'OP001',
            operatorName: '张核销员',
            deviceId: 'DEVICE001',
            gateName: 'A入口'
        };

        let currentTicket = null;
        let html5QrcodeScanner = null;

        // ==================== 初始化 ====================
        window.addEventListener('load', () => {
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            loadTodayStats();
            loadRecentRecords();
            showOperatorInfo();
        });

        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN');
        }

        function showOperatorInfo() {
            document.getElementById('operatorInfo').classList.remove('hidden');
            document.getElementById('operatorName').textContent = OPERATOR_INFO.operatorName;
        }

        // ==================== 扫码功能 ====================
        function startScanner() {
            const scannerPlaceholder = document.getElementById('scannerPlaceholder');
            const scanLine = document.getElementById('scanLine');
            const startBtn = document.getElementById('startScanBtn');
            const stopBtn = document.getElementById('stopScanBtn');

            scannerPlaceholder.classList.add('hidden');
            scanLine.classList.add('active');
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');

            html5QrcodeScanner = new Html5Qrcode("reader");

            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                console.error('启动扫码失败:', err);
                alert('启动摄像头失败，请确保已授权摄像头权限');
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('scannerPlaceholder').classList.remove('hidden');
                    document.getElementById('scanLine').classList.remove('active');
                    document.getElementById('startScanBtn').classList.remove('hidden');
                    document.getElementById('stopScanBtn').classList.add('hidden');
                    html5QrcodeScanner = null;
                }).catch(err => {
                    console.error('停止扫码失败:', err);
                });
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            console.log('扫码成功:', decodedText);

            // 暂停扫码
            if (html5QrcodeScanner) {
                html5QrcodeScanner.pause();
                document.getElementById('scanLine').classList.remove('active');
            }

            // 预校验票券
            verifyTicket(decodedText);
        }

        // ==================== 票券验证 ====================
        async function verifyTicket(qrContent) {
            try {
                const response = await fetch(`${API_BASE}/verify/preview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        qrContent: qrContent,
                        verifierInfo: OPERATOR_INFO
                    })
                });

                const result = await response.json();

                if (result.code === 'SUCCESS') {
                    showTicketModal(result.data);
                } else {
                    showResultModal('error', result.message, result.data);
                }

                // 恢复扫码
                resumeScanning();

            } catch (error) {
                console.error('验证失败:', error);
                showResultModal('error', '网络错误，请重试');
                resumeScanning();
            }
        }

        function resumeScanning() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.resume();
                document.getElementById('scanLine').classList.add('active');
            }
        }

        // ==================== 票券详情弹窗 ====================
        function showTicketModal(ticket) {
            currentTicket = ticket;

            document.getElementById('ticketInfo').innerHTML = `
                <div class="space-y-3">
                    <div class="flex justify-between items-center pb-3 border-b border-outline-variant">
                        <span class="text-on-surface-variant text-sm">票种</span>
                        <span class="font-bold">${ticket.ticketName || '邀请函票'}</span>
                    </div>
                    <div class="flex justify-between items-center pb-3 border-b border-outline-variant">
                        <span class="text-on-surface-variant text-sm">姓名</span>
                        <span class="font-bold">${ticket.holderName || '--'}</span>
                    </div>
                    <div class="flex justify-between items-center pb-3 border-b border-outline-variant">
                        <span class="text-on-surface-variant text-sm">手机</span>
                        <span class="font-bold">${ticket.holderPhone || '--'}</span>
                    </div>
                    <div class="flex justify-between items-center pb-3 border-b border-outline-variant">
                        <span class="text-on-surface-variant text-sm">状态</span>
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-primary/20 text-primary">
                            ✓ 有效
                        </span>
                    </div>
                    <div class="text-on-surface-variant text-sm">
                        <p>有效期：${formatDateTime(ticket.validStartTime)} - ${formatDateTime(ticket.validEndTime)}</p>
                    </div>
                </div>
            `;

            document.getElementById('ticketModal').classList.remove('hidden');
        }

        function closeTicketModal() {
            document.getElementById('ticketModal').classList.add('hidden');
            currentTicket = null;
        }

        // ==================== 确认核销 ====================
        async function confirmWriteoff() {
            if (!currentTicket) return;

            const confirmBtn = document.getElementById('confirmWriteoffBtn');
            confirmBtn.disabled = true;
            confirmBtn.textContent = '核销中...';

            try {
                // 使用正确的API端点：/api/v1/verify/scan
                const response = await fetch(`${API_BASE}/verify/scan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        qrCodeToken: currentTicket.qr_content || currentTicket.ticketNo,
                        verifierInfo: OPERATOR_INFO
                    })
                });

                const result = await response.json();

                closeTicketModal();

                if (result.code === 'SUCCESS') {
                    showResultModal('success', '核销成功', result.data);
                    loadTodayStats();
                    loadRecentRecords();
                } else {
                    showResultModal('error', result.message, result.data);
                }

            } catch (error) {
                console.error('核销失败:', error);
                showResultModal('error', '网络错误，请重试');
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.textContent = '确认核销';
            }
        }

        // ==================== 手机号查询 ====================
        async function searchByMobile() {
            const mobile = document.getElementById('searchMobile').value.trim();

            if (!mobile) {
                alert('请输入手机号');
                return;
            }

            if (!/^1[3-9]\d{9}$/.test(mobile)) {
                alert('请输入正确的手机号格式');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/tickets/search?mobile=${mobile}`);
                const result = await response.json();

                if (result.code === 'SUCCESS' && result.data.total > 0) {
                    showSearchResults(result.data.tickets);
                } else {
                    showResultModal('warning', '未找到有效票券');
                }

            } catch (error) {
                console.error('查询失败:', error);
                showResultModal('error', '网络错误，请重试');
            }
        }

        function showSearchResults(tickets) {
            const container = document.getElementById('searchResults');
            container.classList.remove('hidden');

            container.innerHTML = tickets.map(ticket => `
                <div class="bg-surface rounded-lg p-4 border border-outline-variant hover:border-primary/50 transition">
                    <div class="flex justify-between items-center mb-3">
                        <span class="font-bold">${ticket.ticketName || '票券'}</span>
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-primary/20 text-primary">
                            ✓ 有效
                        </span>
                    </div>
                    <div class="text-sm text-on-surface-variant space-y-1">
                        <p>姓名：${ticket.userName || '--'}</p>
                        <p>手机：${ticket.userPhone ? maskPhone(ticket.userPhone) : '--'}</p>
                        <p class="font-mono text-xs">票号：${ticket.ticketNo || '--'}</p>
                    </div>
                    <button onclick='writeoffByCode("${ticket.qrContent || ticket.ticketNo || ''}")'
                        class="w-full mt-3 bg-primary-container text-on-primary-container py-2 rounded font-bold hover:brightness-110 transition">
                        选择此票核销
                    </button>
                </div>
            `).join('');
        }

        async function writeoffByCode(qrCodeToken) {
            if (!confirm(`确认核销此票券？`)) return;

            try {
                const response = await fetch(`${API_BASE}/verify/scan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        qrCodeToken: qrCodeToken,
                        verifierInfo: OPERATOR_INFO
                    })
                });

                const result = await response.json();

                if (result.code === 'SUCCESS') {
                    showResultModal('success', '核销成功', result.data);
                    loadTodayStats();
                    loadRecentRecords();
                    document.getElementById('searchResults').classList.add('hidden');
                } else {
                    showResultModal('error', result.message || '核销失败', result.data);
                }
            } catch (error) {
                console.error('核销失败:', error);
                showResultModal('error', '网络错误，请重试');
            }
        }

        // ==================== 结果弹窗 ====================
        function showResultModal(type, message, data = null) {
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('resultContent');

            let html = '';

            if (type === 'success') {
                content.className = 'rounded-xl p-8 w-full max-w-sm text-center text-white result-success';
                html = `
                    <span class="material-symbols-outlined text-6xl block mb-4">check_circle</span>
                    <h3 class="text-2xl font-bold mb-2">核销成功</h3>
                    <p class="mb-4">${message}</p>
                    ${data ? `<p class="text-sm opacity-80">${data.ticket_name} - ${data.holder_name}</p>` : ''}
                    <button onclick="closeResultModal()"
                        class="mt-6 bg-white/20 hover:bg-white/30 px-8 py-3 rounded-lg font-bold transition">
                        继续验票
                    </button>
                `;
            } else if (type === 'error') {
                content.className = 'rounded-xl p-8 w-full max-w-sm text-center text-white result-error';
                html = `
                    <span class="material-symbols-outlined text-6xl block mb-4">error</span>
                    <h3 class="text-2xl font-bold mb-2">核销失败</h3>
                    <p class="mb-4">${message}</p>
                    ${data ? `<p class="text-sm opacity-80">核销时间：${formatDateTime(data.used_at)}</p>` : ''}
                    <button onclick="closeResultModal()"
                        class="mt-6 bg-white/20 hover:bg-white/30 px-8 py-3 rounded-lg font-bold transition">
                        关闭
                    </button>
                `;
            } else if (type === 'warning') {
                content.className = 'rounded-xl p-8 w-full max-w-sm text-center text-white result-warning';
                html = `
                    <span class="material-symbols-outlined text-6xl block mb-4">warning</span>
                    <h3 class="text-2xl font-bold mb-2">${message}</h3>
                    <button onclick="closeResultModal()"
                        class="mt-6 bg-white/20 hover:bg-white/30 px-8 py-3 rounded-lg font-bold transition">
                        关闭
                    </button>
                `;
            }

            content.innerHTML = html;
            modal.classList.remove('hidden');

            // 3秒后自动关闭成功提示
            if (type === 'success') {
                setTimeout(closeResultModal, 3000);
            }
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        // ==================== 统计和记录 ====================
        async function loadTodayStats() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const response = await fetch(`${API_BASE}/verify/records?start_date=${today}&end_date=${today}`);
                const result = await response.json();

                if (result.code === 'SUCCESS') {
                    const records = result.data.records;
                    const successCount = records.filter(r => r.verify_result === 'SUCCESS').length;
                    const failCount = records.filter(r => r.verify_result !== 'SUCCESS').length;

                    document.getElementById('successCount').textContent = successCount;
                    document.getElementById('failCount').textContent = failCount;
                }

            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }

        async function loadRecentRecords() {
            try {
                const response = await fetch(`${API_BASE}/verify/records?page=1&page_size=5`);
                const result = await response.json();

                if (result.code === 'SUCCESS' && result.data.records.length > 0) {
                    const container = document.getElementById('recentRecords');
                    container.innerHTML = result.data.records.map(record => {
                        const isSuccess = record.verify_result === 'SUCCESS';
                        return `
                            <div class="flex items-center justify-between py-2 px-4 rounded-lg ${isSuccess ? 'bg-primary/10' : 'bg-error/10'}">
                                <div class="flex items-center gap-3">
                                    <span class="material-symbols-outlined ${isSuccess ? 'text-primary' : 'text-error'}">
                                        ${isSuccess ? 'check_circle' : 'cancel'}
                                    </span>
                                    <div>
                                        <p class="text-sm font-bold">${record.ticket_name || '未知票种'}</p>
                                        <p class="text-xs text-on-surface-variant">${record.visitor_name || '--'} - ${formatTime(record.created_at)}</p>
                                    </div>
                                </div>
                                <span class="text-xs ${isSuccess ? 'text-primary' : 'text-error'}">
                                    ${isSuccess ? '✓' : '✗'}
                                </span>
                            </div>
                        `;
                    }).join('');
                }

            } catch (error) {
                console.error('加载记录失败:', error);
            }
        }

        // ==================== 工具函数 ====================
        function formatDateTime(dateStr) {
            if (!dateStr) return '--';
            const date = new Date(dateStr);
            return `${date.getMonth() + 1}月${date.getDate()}日 ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function formatTime(dateStr) {
            if (!dateStr) return '--:--';
            const date = new Date(dateStr);
            return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }
    </script>
</body>
