<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邀请函申请测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            background: white;
            border: 1px solid #ddd;
        }
        .success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <h1>邀请函申请测试</h1>

    <div class="info">
        <strong>测试说明：</strong><br>
        填写表单后点击提交，查看申请结果<br>
        验证码固定为：123456
    </div>

    <form id="applicationForm">
        <div class="form-group">
            <label>姓名 *</label>
            <input type="text" id="name" required value="测试用户">
        </div>

        <div class="form-group">
            <label>身份证号 *</label>
            <input type="text" id="idCard" required value="110101199001011234" maxlength="18">
        </div>

        <div class="form-group">
            <label>手机号 *</label>
            <input type="tel" id="phone" required value="13800138888" maxlength="11">
        </div>

        <div class="form-group">
            <label>验证码 *</label>
            <input type="text" id="smsCode" required value="123456" maxlength="6">
            <small>测试固定为123456</small>
        </div>

        <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="email" value="test@example.com">
        </div>

        <div class="form-group">
            <label>公司</label>
            <input type="text" id="company" value="测试公司">
        </div>

        <div class="form-group">
            <label>职位</label>
            <input type="text" id="position" value="测试职位">
        </div>

        <div class="form-group">
            <label>申请理由</label>
            <textarea id="reason" rows="3">申请参加博览会</textarea>
        </div>

        <div class="form-group">
            <label>邀请码（选填）</label>
            <input type="text" id="inviteCode" placeholder="有邀请码可自动通过">
        </div>

        <button type="submit">提交申请</button>
    </form>

    <div id="result" class="result" style="display: none;"></div>

    <script>
        const API_BASE = 'http://localhost:3001/api/v1';

        document.getElementById('applicationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result info';
            resultDiv.innerHTML = '提交中...';

            const applicantInfo = {
                name: document.getElementById('name').value.trim(),
                idCard: document.getElementById('idCard').value.trim().toUpperCase(),
                phone: document.getElementById('phone').value.trim(),
                email: document.getElementById('email').value.trim() || null,
                company: document.getElementById('company').value.trim() || null,
                position: document.getElementById('position').value.trim() || null,
                reason: document.getElementById('reason').value.trim() || null,
                inviteCode: document.getElementById('inviteCode').value.trim().toUpperCase() || null,
                category: 'GENERAL'
            };

            const smsCode = document.getElementById('smsCode').value.trim();

            try {
                console.log('发送申请请求...');
                console.log('数据:', { applicantInfo, smsCode });

                const response = await fetch(`${API_BASE}/invitations/apply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ applicantInfo, smsCode })
                });

                console.log('响应状态:', response.status);

                const result = await response.json();
                console.log('响应结果:', result);

                if (result.code === 'SUCCESS') {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✓ 申请成功</h3>
                        <p><strong>申请单号：</strong>${result.data.applicationNo}</p>
                        <p><strong>审核状态：</strong>${result.data.auditStatus}</p>
                        ${result.data.ticket ? `
                            <p><strong>票号：</strong>${result.data.ticket.ticketNo}</p>
                            <p><strong>二维码：</strong>${result.data.ticket.qrCodeToken.substring(0, 30)}...</p>
                        ` : '<p>您的申请正在审核中，请耐心等待</p>'}
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<h3>✗ 申请失败</h3><p>${result.message}</p>`;
                }

            } catch (error) {
                console.error('请求失败:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h3>✗ 网络错误</h3><p>${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
